name: Build FPSBooster Dylib

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-fpsbooster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Cache Theos & SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-macos-sdk-v1

      - name: Setup Theos & iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks-temp
          cp -r $HOME/sdks-temp/iPhoneOS*.sdk $HOME/theos/sdks/

      - name: Build Dylib
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean || true
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-dylib
          path: .theos/obj/debug/arm64/FPSBooster.dylib
