name: Build FPSBooster Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-fpsbooster
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make perl git curl zip unzip fakeroot

      - name: Setup Theos, Toolchain Symlinks & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          ln -s /usr/bin/clang $HOME/theos/toolchain/linux/iphone/bin/clang
          ln -s /usr/bin/clang++ $HOME/theos/toolchain/linux/iphone/bin/clang++
          ln -s /usr/bin/ld.lld $HOME/theos/toolchain/linux/iphone/bin/ld
          ln -s /usr/bin/llvm-ar $HOME/theos/toolchain/linux/iphone/bin/ar
          ln -s /usr/bin/llvm-strip $HOME/theos/toolchain/linux/iphone/bin/strip
          ln -s /usr/bin/llvm-nm $HOME/theos/toolchain/linux/iphone/bin/nm
          ln -s /usr/bin/llvm-objcopy $HOME/theos/toolchain/linux/iphone/bin/objcopy
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks-temp
          cp -r $HOME/sdks-temp/iPhoneOS*.sdk $HOME/theos/sdks/

      - name: Build Dylib
        env:
          THEOS: /home/runner/theos
        run: |
          make clean || true
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-dylib
          path: .theos/obj/debug/arm64/FPSBooster.dylib
