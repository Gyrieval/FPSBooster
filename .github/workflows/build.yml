name: Build FPSBooster Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git perl curl zip clang lld llvm
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS14.5.sdk.tar.xz -o sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xf sdk.tar.xz -C $HOME/theos/sdks

      - name: Build .dylib
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-dylib
          path: output/*.dylib
