name: Build FPSBooster Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Build .dylib
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-dylib
          path: output/*.dylib
