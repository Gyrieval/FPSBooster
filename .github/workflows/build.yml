name: Build FPSBooster Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-fpsbooster
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: ProcursusTeam/setup-theos@v1

      - name: Build Dylib
        run: |
          make clean || true
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-dylib
          path: .theos/obj/debug/arm64/FPSBooster.dylib
